name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - '.github/workflows/publish-docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Render doc and update gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: doc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deploy explicitly: pushes made with GITHUB_TOKEN do not trigger
      # another branch-based Pages build.
      - name: Upload the documentation website
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/_site

      - name: Deploy the documentation website
        id: deployment
        uses: actions/deploy-pages@v4
